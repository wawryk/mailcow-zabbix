# Szablon "Mailcow by Zabbix agent" - UserParameters
# Kopiuj do: /etc/zabbix/zabbix_agent2.d/   (agent 2)
#       lub: /etc/zabbix/zabbix_agentd.d/   (agent 1)
# Wymagane w glownym pliku agenta: Timeout=20   (sprawdzenia DNS i certyfikatow trwaja dluzej niz domyslne 3 s)

# Reputacja / DNS (bez root)
UserParameter=mailrep.rbl[*],/usr/local/bin/mailrep.sh check "$1" "$2" "$3"
UserParameter=mailrep.discovery[*],/usr/local/bin/mailrep.sh "discover-$1" "$2" "$3"
UserParameter=mailrep.dns[*],/usr/local/bin/mailrep.sh dns "$1" "$2" "$3"
UserParameter=mailrep.ptr[*],/usr/local/bin/mailrep.sh ptr "$1" "$2"
UserParameter=mailrep.fcrdns[*],/usr/local/bin/mailrep.sh fcrdns "$1" "$2" "$3"
UserParameter=mailrep.certdays[*],/usr/local/bin/mailrep.sh certdays "$1" "$2" "$3"

# Metryki mailcow (przez sudo, patrz sudoers-zabbix-mailcow)
UserParameter=mailcow.mail[*],sudo -n /usr/local/bin/mailcow_mail.sh "$1" "$2"
