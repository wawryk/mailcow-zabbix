        - uuid: 34b855df4b31494eaf382a39eb94cd78
          name: 'Service: HTTPS (webmail/admin) port 443'
          type: SIMPLE
          key: net.tcp.service[https,{$MAIL.HOSTNAME},443]
          delay: 1m
          history: 31d
          description: Dostepnosc HTTPS (webmail/admin) z serwera/proxy Zabbix (simple check).
          valuemap:
            name: Mailcow yes/no
          tags:
            - tag: component
              value: services
          triggers:
            - uuid: 1ea7a18dc2484817a33edb58696c495c
              expression: max(/Mailcow by Zabbix agent/net.tcp.service[https,{$MAIL.HOSTNAME},443],#3)=0
              name: 'Mailcow: HTTPS (webmail/admin) (port 443) is not reachable'
              priority: HIGH
              description: Usluga nie odpowiada 3 razy z rzedu. Sprawdz kontenery, firewall i blokady portow u dostawcy.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: d6b025bc267248e6ab5f684ae2e02c45
          name: 'Microsoft SNDS: blocked IP status'
          type: HTTP_AGENT
          key: mailcow.snds.ipstatus
          delay: 6h
          history: 90d
          value_type: TEXT
          status: DISABLED
          description: Lista IP zablokowanych przez Microsoft (Outlook/Hotmail) z SNDS Automated Data Access. Pusta odpowiedz = brak blokad. Wlacz po ustawieniu {$SNDS.KEY}.
          url: https://sendersupport.olc.protection.outlook.com/snds/ipStatus.aspx?key={$SNDS.KEY}
          timeout: 15s
          tags:
            - tag: component
              value: reputation
          triggers:
            - uuid: 5d070be929b641d6a2e65b896751bd81
              expression: find(/Mailcow by Zabbix agent/mailcow.snds.ipstatus,,"regexp","[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+")=1
              name: 'Mailcow: Microsoft SNDS reports blocked IP'
              priority: HIGH
              description: 'Microsoft blokuje IP serwera. Szczegoly w panelu SNDS; wniosek o odblokowanie: https://sender.office.com'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: reputation
      discovery_rules:
        - uuid: f82508b6a0d247b4839c04116b6c4020
          name: RBL (IP) - critical lists
          key: mailrep.discovery[zones,"{$RBL.IP.ZONES}"]
          delay: 1h
          lifetime: 7d
          description: Listy z makra {$RBL.IP.ZONES}, rozdzielone przecinkami.
          item_prototypes:
            - uuid: 8f716a12e1264c52aa90f52d6559f7b0
              name: 'RBL: {$MAIL.IP} on {#RBL}'
              key: mailrep.rbl[{$MAIL.IP},{#RBL},{$DNS.RESOLVER}]
              delay: '{$RBL.CHECK.INTERVAL}'
              history: 90d
              description: 0 = czysto, 1 = NA LISCIE, 2 = blad zapytania (np. odmowa dla publicznego resolvera).
              valuemap:
                name: Mailcow RBL status
              tags:
                - tag: component
                  value: reputation
                - tag: rbl
                  value: '{#RBL}'
              trigger_prototypes:
                - uuid: f07fcbf5748648269e608b9be50dc326
                  expression: last(/Mailcow by Zabbix agent/mailrep.rbl[{$MAIL.IP},{#RBL},{$DNS.RESOLVER}])=1
