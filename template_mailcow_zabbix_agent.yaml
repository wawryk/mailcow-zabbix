          name: RBL (IP) - critical lists
          key: mailrep.discovery[zones,"{$RBL.IP.ZONES}"]
          delay: 1h
          lifetime: 7d
          description: Listy z makra {$RBL.IP.ZONES}, rozdzielone przecinkami.
          item_prototypes:
            - uuid: 8f716a12e1264c52aa90f52d6559f7b0
              name: 'RBL: {$MAIL.IP} on {#RBL}'
              key: mailrep.rbl[{$MAIL.IP},{#RBL},{$DNS.RESOLVER}]
              delay: '{$RBL.CHECK.INTERVAL}'
              history: 90d
              description: 0 = czysto, 1 = NA LISCIE, 2 = blad zapytania (np. odmowa dla publicznego resolvera).
              valuemap:
                name: Mailcow RBL status
              tags:
                - tag: component
                  value: reputation
                - tag: rbl
                  value: '{#RBL}'
              trigger_prototypes:
                - uuid: f07fcbf5748648269e608b9be50dc326
                  expression: last(/Mailcow by Zabbix agent/mailrep.rbl[{$MAIL.IP},{#RBL},{$DNS.RESOLVER}])=1
                  name: 'Mailcow: {$MAIL.IP} is listed on {#RBL}'
                  priority: HIGH
                  manual_close: 'YES'
                  description: Sprawdz przyczyne (przejete konto? otwarty relay?), usun ja i zlec delisting na stronie listy.
                  tags:
                    - tag: scope
                      value: reputation
                - uuid: 71fc6fc1ea97467db29b8b5b15eca096
                  expression: min(/Mailcow by Zabbix agent/mailrep.rbl[{$MAIL.IP},{#RBL},{$DNS.RESOLVER}],2h)=2
                  name: 'Mailcow: RBL check {#RBL} for {$MAIL.IP} is failing'
                  priority: WARNING
                  manual_close: 'YES'
                  description: Lista odrzuca zapytania (Spamhaus/URIBL przez publiczny DNS - uzyj klucza DQS) albo makro {$MAIL.IP}/{$MAIL.DOMAINS} nie jest ustawione.
                  tags:
                    - tag: scope
                      value: reputation
          graph_prototypes:
