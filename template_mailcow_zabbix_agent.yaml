              trigger_prototypes:
                - uuid: 70283ff9f656490d9c5ef5e5c882f70e
                  expression: last(/Mailcow by Zabbix agent/mailrep.rbl[{#DOMAIN},{#RBL},{$DNS.RESOLVER}])=1
                  name: 'Mailcow: {#DOMAIN} is listed on {#RBL}'
                  priority: HIGH
