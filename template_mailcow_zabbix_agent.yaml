              name: 'Mailcow: PTR of {$MAIL.IP} is not {$MAIL.HOSTNAME}'
              priority: AVERAGE
              description: Brak zgodnego rDNS powoduje odrzucanie lub spam-folder u wielu odbiorcow. PTR ustawia sie u dostawcy serwera (Infomaniak/Hetzner).
