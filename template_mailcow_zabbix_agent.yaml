        - uuid: 319eeada870040ba9d3ac4e7e0eb7c39
          name: RBL (domains)
          key: mailrep.discovery[domainzones,"{$MAIL.DOMAINS}","{$RBL.DOMAIN.ZONES}"]
          delay: 1h
          lifetime: 7d
          description: Listy z makra {$RBL.DOMAIN.ZONES}, rozdzielone przecinkami.
          item_prototypes:
            - uuid: 69bddf0f1aa04bad8899ce4628dc7d95
              name: 'RBL: {#DOMAIN} on {#RBL}'
              key: mailrep.rbl[{#DOMAIN},{#RBL},{$DNS.RESOLVER}]
              delay: '{$RBL.CHECK.INTERVAL}'
              history: 90d
              description: 0 = czysto, 1 = NA LISCIE, 2 = blad zapytania (np. odmowa dla publicznego resolvera).
              valuemap:
                name: Mailcow RBL status
              tags:
                - tag: component
                  value: reputation
                - tag: rbl
