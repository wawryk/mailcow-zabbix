      macros:
        - macro: '{$MAIL.IP}'
          value: ''
          description: Publiczny IPv4 serwera (wysylka). WYMAGANE.
        - macro: '{$MAIL.HOSTNAME}'
          value: ''
          description: Nazwa hosta MAILCOW_HOSTNAME, np. mail.example.com (PTR, MX, TLS, porty). WYMAGANE.
        - macro: '{$MAIL.DOMAINS}'
          value: ''
          description: 'Domeny obslugiwane przez serwer, po przecinku: example.com,example.de'
        - macro: '{$DNS.RESOLVER}'
          value: 1.1.1.1
          description: Resolver dla zapytan DNS/RBL. Spamhaus/URIBL odrzucaja publiczne resolvery - patrz README.
        - macro: '{$RBL.IP.ZONES}'
          value: bl.spamcop.net,b.barracudacentral.org,psbl.surriel.com,bl.mailspike.net
          description: Listy IP o krytycznym znaczeniu (trigger HIGH). Dodaj KLUCZ.zen.dq.spamhaus.net po rejestracji DQS.
        - macro: '{$RBL.IP.ZONES.LOW}'
          value: dnsbl-1.uceprotect.net
          description: Listy IP informacyjne (trigger WARNING).
        - macro: '{$RBL.DOMAIN.ZONES}'
          value: ''
          description: Listy domenowe, np. KLUCZ.dbl.dq.spamhaus.net. Puste = brak sprawdzen.
        - macro: '{$RBL.CHECK.INTERVAL}'
          value: 30m
          description: Czestotliwosc sprawdzen RBL (nie przesadzaj - limity zapytan list).
        - macro: '{$MAIL.QUEUE.MAX}'
          value: '100'
          description: Prog kolejki Postfixa.
        - macro: '{$MAIL.DEFERRED.MAX}'
          value: '50'
          description: Prog wiadomosci odroczonych.
        - macro: '{$MAIL.SENT.MAX}'
          value: '500'
          description: Max wiadomosci wychodzacych na 10 min (dostroic po tygodniu obserwacji).
        - macro: '{$MAIL.BOUNCED.MAX}'
          value: '20'
          description: Max odbic na 10 min.
        - macro: '{$MAILCOW.BACKUP.DIR}'
          value: /opt/backup
          description: Katalog MAILCOW_BACKUP_LOCATION z katalogami mailcow-*.
        - macro: '{$MAILCOW.BACKUP.MAXAGE}'
          value: '26'
          description: Maksymalny wiek ostatniego backupu w godzinach.
        - macro: '{$MAILCOW.DKIM.SELECTOR}'
          value: dkim
          description: 'Selektor DKIM (mailcow domyslnie: dkim).'
        - macro: '{$CERT.EXPIRY.WARN}'
          value: '14'
          description: Ostrzezenie o wygasaniu certyfikatu (dni).
        - macro: '{$SNDS.KEY}'
          value: ''
          description: Klucz Microsoft SNDS Automated Data Access (item SNDS domyslnie wylaczony).
      valuemaps:
        - uuid: ffd8889a2a554e048b4f5320b554c7b8
          name: Mailcow RBL status
          mappings:
            - value: '0'
              newvalue: Clean
            - value: '1'
              newvalue: LISTED
            - value: '2'
              newvalue: Check error
        - uuid: 985f75eee6dd4264bbb881396925742e
          name: Mailcow yes/no
          mappings:
            - value: '0'
              newvalue: No / Down
            - value: '1'
              newvalue: Yes / Up
