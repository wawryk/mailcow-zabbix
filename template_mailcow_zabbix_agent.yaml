                - uuid: db801a7940cf4027bab4f7b9eae9d626
                  expression: min(/Mailcow by Zabbix agent/mailrep.rbl[{$MAIL.IP},{#RBL},{$DNS.RESOLVER},low],2h)=2
                  name: 'Mailcow: RBL check {#RBL} for {$MAIL.IP} is failing (informational)'
