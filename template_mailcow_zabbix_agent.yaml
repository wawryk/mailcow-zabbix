          name: 'Service: Submission port 587'
          type: SIMPLE
          key: net.tcp.service[tcp,{$MAIL.HOSTNAME},587]
          delay: 1m
          history: 31d
          description: Dostepnosc Submission z serwera/proxy Zabbix (simple check).
          valuemap:
            name: Mailcow yes/no
          tags:
            - tag: component
              value: services
          triggers:
            - uuid: 364d36782ce948848d605a57a0c902a6
              expression: max(/Mailcow by Zabbix agent/net.tcp.service[tcp,{$MAIL.HOSTNAME},587],#3)=0
              name: 'Mailcow: Submission (port 587) is not reachable'
              priority: AVERAGE
              description: Usluga nie odpowiada 3 razy z rzedu. Sprawdz kontenery, firewall i blokady portow u dostawcy.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 9b5753d55db547c4b2d6924d66c965b9
          name: 'Service: IMAPS port 993'
          type: SIMPLE
          key: net.tcp.service[tcp,{$MAIL.HOSTNAME},993]
          delay: 1m
          history: 31d
          description: Dostepnosc IMAPS z serwera/proxy Zabbix (simple check).
          valuemap:
            name: Mailcow yes/no
          tags:
            - tag: component
              value: services
          triggers:
            - uuid: 2dc40f7d9eb24f89850c3b7c60154bbc
              expression: max(/Mailcow by Zabbix agent/net.tcp.service[tcp,{$MAIL.HOSTNAME},993],#3)=0
              name: 'Mailcow: IMAPS (port 993) is not reachable'
              priority: HIGH
              description: Usluga nie odpowiada 3 razy z rzedu. Sprawdz kontenery, firewall i blokady portow u dostawcy.
              manual_close: 'YES'
