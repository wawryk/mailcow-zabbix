        - uuid: e572be267cba4918b3b128270ef10cac
          name: Mail domains (DNS records)
          key: mailrep.discovery[domains,"{$MAIL.DOMAINS}"]
          delay: 1h
          lifetime: 7d
          description: 'Domeny z makra {$MAIL.DOMAINS}: kontrola SPF, DMARC, DKIM i MX.'
          item_prototypes:
            - uuid: 34c12627bc084c11af56e6bba3e4d7a4
              name: 'DNS: SPF record of {#DOMAIN}'
              key: mailrep.dns[TXT,{#DOMAIN},{$DNS.RESOLVER}]
              delay: 1h
              history: 90d
              value_type: CHAR
              description: Zawartosc rekordu TXT {#DOMAIN}. Pusty = brak rekordu, DNS_ERROR = blad zapytania.
              tags:
                - tag: component
                  value: dns
                - tag: domain
                  value: '{#DOMAIN}'
              trigger_prototypes:
                - uuid: d39f099bb7e64b0398ae6d9619c2a1e8
                  expression: find(/Mailcow by Zabbix agent/mailrep.dns[TXT,{#DOMAIN},{$DNS.RESOLVER}],,"like","v=spf1")=0 and find(/Mailcow by Zabbix agent/mailrep.dns[TXT,{#DOMAIN},{$DNS.RESOLVER}],,"like","DNS_ERROR")=0
                  name: 'Mailcow: SPF record missing or wrong for {#DOMAIN}'
                  priority: AVERAGE
                  manual_close: 'YES'
                  description: Brak rekordu SPF - poczta bedzie oznaczana jako spam lub odrzucana.
                  tags:
                    - tag: scope
                      value: reputation
            - uuid: 691ec59255bc43f7954656327e0854b5
              name: 'DNS: DMARC record of {#DOMAIN}'
              key: mailrep.dns[TXT,_dmarc.{#DOMAIN},{$DNS.RESOLVER}]
              delay: 1h
              history: 90d
              value_type: CHAR
              description: Zawartosc rekordu TXT _dmarc.{#DOMAIN}. Pusty = brak rekordu, DNS_ERROR = blad zapytania.
              tags:
                - tag: component
                  value: dns
                - tag: domain
                  value: '{#DOMAIN}'
              trigger_prototypes:
                - uuid: ffa7fd16ac9e4c6ca60c58c8e9336d5f
                  expression: find(/Mailcow by Zabbix agent/mailrep.dns[TXT,_dmarc.{#DOMAIN},{$DNS.RESOLVER}],,"like","v=DMARC1")=0 and find(/Mailcow by Zabbix agent/mailrep.dns[TXT,_dmarc.{#DOMAIN},{$DNS.RESOLVER}],,"like","DNS_ERROR")=0
                  name: 'Mailcow: DMARC record missing or wrong for {#DOMAIN}'
                  priority: WARNING
                  manual_close: 'YES'
                  description: Brak DMARC - Gmail/Yahoo wymagaja go od nadawcow masowych, obniza zaufanie.
                  tags:
                    - tag: scope
                      value: reputation
            - uuid: 566de9a2f8e04610aa24fd3a39a2665a
              name: 'DNS: DKIM record of {#DOMAIN}'
              key: mailrep.dns[TXT,{$MAILCOW.DKIM.SELECTOR}._domainkey.{#DOMAIN},{$DNS.RESOLVER}]
              delay: 1h
              history: 90d
              value_type: CHAR
              description: Zawartosc rekordu TXT {$MAILCOW.DKIM.SELECTOR}._domainkey.{#DOMAIN}. Pusty = brak rekordu, DNS_ERROR = blad zapytania.
              tags:
                - tag: component
                  value: dns
                - tag: domain
                  value: '{#DOMAIN}'
              trigger_prototypes:
                - uuid: 521d7f56b8fb46c292a91f1b2aa3bc2d
                  expression: find(/Mailcow by Zabbix agent/mailrep.dns[TXT,{$MAILCOW.DKIM.SELECTOR}._domainkey.{#DOMAIN},{$DNS.RESOLVER}],,"like","p=")=0 and find(/Mailcow by Zabbix agent/mailrep.dns[TXT,{$MAILCOW.DKIM.SELECTOR}._domainkey.{#DOMAIN},{$DNS.RESOLVER}],,"like","DNS_ERROR")=0
                  name: 'Mailcow: DKIM record missing or wrong for {#DOMAIN}'
                  priority: AVERAGE
                  manual_close: 'YES'
                  description: 'Brak klucza DKIM w DNS - podpis mailcow nie zostanie zweryfikowany. Klucz: panel mailcow > Configuration > ARC/DKIM keys.'
                  tags:
                    - tag: scope
                      value: reputation
            - uuid: c53b4afc709b4ccbb8602925da410877
              name: 'DNS: MX record of {#DOMAIN}'
              key: mailrep.dns[MX,{#DOMAIN},{$DNS.RESOLVER}]
              delay: 1h
              history: 90d
              value_type: CHAR
              description: Zawartosc rekordu MX {#DOMAIN}. Pusty = brak rekordu, DNS_ERROR = blad zapytania.
              tags:
                - tag: component
                  value: dns
                - tag: domain
                  value: '{#DOMAIN}'
              trigger_prototypes:
                - uuid: 4ce111b1cbc94d268767db63c6baf87f
                  expression: find(/Mailcow by Zabbix agent/mailrep.dns[MX,{#DOMAIN},{$DNS.RESOLVER}],,"like","{$MAIL.HOSTNAME}")=0 and find(/Mailcow by Zabbix agent/mailrep.dns[MX,{#DOMAIN},{$DNS.RESOLVER}],,"like","DNS_ERROR")=0
                  name: 'Mailcow: MX record missing or wrong for {#DOMAIN}'
                  priority: AVERAGE
                  manual_close: 'YES'
                  description: Rekord MX domeny nie wskazuje na ten serwer mailcow.
                  tags:
                    - tag: scope
                      value: reputation
