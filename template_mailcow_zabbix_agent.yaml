              priority: AVERAGE
              description: 'Serwery docelowe odrzucaja poczte powolujac sie na reputacje/listy blokujace. Sprawdz log: docker compose logs --since 1h postfix-mailcow | grep -iE ''block|reputation|S3150|5.7.26'''
              manual_close: 'YES'
              tags:
