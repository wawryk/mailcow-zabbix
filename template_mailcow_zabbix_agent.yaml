zabbix_export:
  version: '6.0'
  date: '2026-11-21T12:00:00Z'
  groups:
    - uuid: 640dc27249724cf686fcb6b103049472
      name: Templates/Applications
  templates:
    - uuid: 80af825f96824dff8733e3c42e391b9f
      template: Mailcow by Zabbix agent
      name: Mailcow by Zabbix agent
      description: 'Monitoring serwerow pocztowych mailcow-dockerized: kolejka i ruch Postfixa (statusy dostarczen), rspamd (akcje, oceny spamu, Bayes), kontenery, backup, reputacja (RBL, PTR/FCrDNS, Microsoft SNDS, odrzucenia reputacyjne), rekordy SPF/DKIM/DMARC/MX, certyfikaty TLS i dostepnosc portow.

        Wymaga skryptow mailrep.sh i mailcow_mail.sh, pliku UserParameter i wpisu sudoers - patrz README.md.

        Laczyc z szablonem ''Linux by Zabbix agent'' (CPU/RAM/dysk).'
      groups:
        - name: Templates/Applications
      items:
        - uuid: 21ce72ac18c2443ab4a5639c30f287a2
          name: 'Postfix: log stats (10 min, JSON)'
          key: mailcow.mail[postfix_stats,10]
          delay: 10m
          history: '0'
          value_type: TEXT
          description: Statusy dostarczen i odrzucenia z logu postfix-mailcow w ostatnich 10 min. Zrodlo dla itemow zaleznych.
          tags:
            - tag: component
              value: mailflow
        - uuid: 66a892d1dc704e389fe1cbb23961c9db
          name: 'Rspamd: stats (JSON)'
          key: mailcow.mail[rspamd_stats,10]
          delay: 10m
          history: '0'
          value_type: TEXT
          description: Liczniki rspamd (/stat) i oceny wiadomosci z historii (/history) z ostatnich 10 min, czytane przez socket kontrolera w php-fpm-mailcow. Zrodlo dla itemow zaleznych.
          tags:
            - tag: component
              value: spam
        - uuid: 4abfd376992c40b2b31f578d46cd6e4f
          name: 'Postfix: queue size'
          key: mailcow.mail[queue_total]
          delay: 5m
          history: 31d
          value_type: FLOAT
          units: msg
          description: Liczba wiadomosci w kolejce Postfixa (postfix-mailcow). -1 = brak dostepu do dockera/kontenera.
          tags:
            - tag: component
              value: queue
          triggers:
            - uuid: 2b575a4d9d3248a39dce4ca800f35eb7
              expression: min(/Mailcow by Zabbix agent/mailcow.mail[queue_total],15m)>{$MAIL.QUEUE.MAX}
              name: 'Mailcow: Postfix queue > {$MAIL.QUEUE.MAX} for 15m'
              priority: HIGH
              description: 'Rosnaca kolejka zwykle oznacza problem z dostarczaniem albo przejete konto wysylajace spam. Sprawdz: docker compose exec postfix-mailcow mailq'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
            - uuid: 551a1c461061436eabe9b2c013005a06
              expression: last(/Mailcow by Zabbix agent/mailcow.mail[queue_total])<0
              name: 'Mailcow: cannot read mail metrics (docker/sudo/postfix-mailcow)'
              priority: WARNING
              description: 'Skrypt mailcow_mail.sh zwraca -1: brak dockera, brak kontenera postfix-mailcow albo brak wpisu sudoers.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 2d719519b4894d928a8da7300690ac0b
          name: 'Postfix: deferred messages'
          key: mailcow.mail[queue_deferred]
          delay: 5m
          history: 31d
          value_type: FLOAT
          units: msg
          description: Wiadomosci odroczone (deferred) - serwery docelowe odrzucaja tymczasowo.
          tags:
            - tag: component
              value: queue
          triggers:
            - uuid: 3d7a9c31e46640b18e8a1195b5b587b8
              expression: min(/Mailcow by Zabbix agent/mailcow.mail[queue_deferred],30m)>{$MAIL.DEFERRED.MAX}
              name: 'Mailcow: deferred queue > {$MAIL.DEFERRED.MAX} for 30m'
              priority: AVERAGE
              description: 'Sprawdz przyczyny w logu (np. blokady reputacyjne Microsoft/Gmail): docker compose logs postfix-mailcow | grep deferred'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
        - uuid: 661d468ab56549b2924b7bc48f46ac65
          name: 'Postfix: outbound sent (10 min)'
          type: DEPENDENT
          key: mailcow.mail[sent,10]
          delay: '0'
          history: 31d
          value_type: FLOAT
          units: msg
          description: Wiadomosci wyslane na zewnatrz w ostatnich 10 min (bez lokalnych dostarczen do dovecot).
          master_item:
            key: mailcow.mail[postfix_stats,10]
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.sent
          tags:
            - tag: component
              value: mailflow
          triggers:
            - uuid: cb78feeddeb34f6086a9bed45c61a734
              expression: last(/Mailcow by Zabbix agent/mailcow.mail[sent,10])>{$MAIL.SENT.MAX}
              name: 'Mailcow: unusually high outbound volume (>{$MAIL.SENT.MAX}/10 min)'
              priority: HIGH
              description: Mozliwe przejete konto rozsylajace spam - grozi wpisem na listy RBL. Sprawdz nadawcow w panelu mailcow (Logs > Postfix) i ewentualnie zablokuj konto.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
        - uuid: 1f57237a7ac24acd8477ebeb25eab953
