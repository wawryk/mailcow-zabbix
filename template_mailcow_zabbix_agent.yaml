              name: 'Mailcow: many bounces (>{$MAIL.BOUNCED.MAX}/10 min)'
              priority: WARNING
              description: Duza liczba odbic - sprawdz, czy nie dotycza jednego nadawcy (spam) lub jednej domeny docelowej.
              manual_close: 'YES'
              tags:
