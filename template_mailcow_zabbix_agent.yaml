zabbix_export:
  version: '6.0'
  date: '2026-11-06T12:00:00Z'
  groups:
    - uuid: 640dc27249724cf686fcb6b103049472
      name: Templates/Applications
  templates:
    - uuid: 80af825f96824dff8733e3c42e391b9f
      template: Mailcow by Zabbix agent
      name: Mailcow by Zabbix agent
      description: 'Monitoring serwerow pocztowych mailcow-dockerized: kolejka i ruch Postfixa, kontenery, backup, reputacja (RBL, PTR/FCrDNS, Microsoft SNDS, odrzucenia reputacyjne), rekordy SPF/DKIM/DMARC/MX, certyfikaty TLS i dostepnosc portow.

        Wymaga skryptow mailrep.sh i mailcow_mail.sh, pliku UserParameter i wpisu sudoers - patrz README.md.

        Laczyc z szablonem ''Linux by Zabbix agent'' (CPU/RAM/dysk).'
      groups:
        - name: Templates/Applications
      items:
        - uuid: 4abfd376992c40b2b31f578d46cd6e4f
          name: 'Postfix: queue size'
          key: mailcow.mail[queue_total]
          delay: 5m
          history: 31d
          value_type: FLOAT
          units: msg
          description: Liczba wiadomosci w kolejce Postfixa (postfix-mailcow). -1 = brak dostepu do dockera/kontenera.
          tags:
            - tag: component
              value: queue
          triggers:
            - uuid: 2b575a4d9d3248a39dce4ca800f35eb7
              expression: min(/Mailcow by Zabbix agent/mailcow.mail[queue_total],15m)>{$MAIL.QUEUE.MAX}
              name: 'Mailcow: Postfix queue > {$MAIL.QUEUE.MAX} for 15m'
              priority: HIGH
              description: 'Rosnaca kolejka zwykle oznacza problem z dostarczaniem albo przejete konto wysylajace spam. Sprawdz: docker compose exec postfix-mailcow mailq'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
            - uuid: 551a1c461061436eabe9b2c013005a06
              expression: last(/Mailcow by Zabbix agent/mailcow.mail[queue_total])<0
              name: 'Mailcow: cannot read mail metrics (docker/sudo/postfix-mailcow)'
              priority: WARNING
              description: 'Skrypt mailcow_mail.sh zwraca -1: brak dockera, brak kontenera postfix-mailcow albo brak wpisu sudoers.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 2d719519b4894d928a8da7300690ac0b
          name: 'Postfix: deferred messages'
          key: mailcow.mail[queue_deferred]
          delay: 5m
          history: 31d
          value_type: FLOAT
          units: msg
          description: Wiadomosci odroczone (deferred) - serwery docelowe odrzucaja tymczasowo.
          tags:
            - tag: component
              value: queue
          triggers:
            - uuid: 3d7a9c31e46640b18e8a1195b5b587b8
              expression: min(/Mailcow by Zabbix agent/mailcow.mail[queue_deferred],30m)>{$MAIL.DEFERRED.MAX}
              name: 'Mailcow: deferred queue > {$MAIL.DEFERRED.MAX} for 30m'
              priority: AVERAGE
              description: 'Sprawdz przyczyny w logu (np. blokady reputacyjne Microsoft/Gmail): docker compose logs postfix-mailcow | grep deferred'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
        - uuid: 661d468ab56549b2924b7bc48f46ac65
          name: 'Postfix: outbound sent (10 min)'
          key: mailcow.mail[sent,10]
          delay: 10m
          history: 31d
          value_type: FLOAT
          units: msg
          description: Wiadomosci wyslane na zewnatrz w ostatnich 10 min (bez lokalnych dostarczen do dovecot).
          tags:
            - tag: component
              value: mailflow
          triggers:
            - uuid: cb78feeddeb34f6086a9bed45c61a734
              expression: last(/Mailcow by Zabbix agent/mailcow.mail[sent,10])>{$MAIL.SENT.MAX}
              name: 'Mailcow: unusually high outbound volume (>{$MAIL.SENT.MAX}/10 min)'
              priority: HIGH
              description: Mozliwe przejete konto rozsylajace spam - grozi wpisem na listy RBL. Sprawdz nadawcow w panelu mailcow (Logs > Postfix) i ewentualnie zablokuj konto.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
        - uuid: 1f57237a7ac24acd8477ebeb25eab953
          name: 'Postfix: bounced (10 min)'
          key: mailcow.mail[bounced,10]
          delay: 10m
          history: 31d
          value_type: FLOAT
          units: msg
          description: Wiadomosci trwale odrzucone (status=bounced) w ostatnich 10 min.
          tags:
            - tag: component
              value: mailflow
          triggers:
            - uuid: 2906d05be8a34d5c89e81262f8a06a49
              expression: last(/Mailcow by Zabbix agent/mailcow.mail[bounced,10])>{$MAIL.BOUNCED.MAX}
              name: 'Mailcow: many bounces (>{$MAIL.BOUNCED.MAX}/10 min)'
              priority: WARNING
              description: Duza liczba odbic - sprawdz, czy nie dotycza jednego nadawcy (spam) lub jednej domeny docelowej.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
        - uuid: 4ee501b8b5dc4837889f2c207d9f68b9
          name: 'Postfix: reputation rejects (10 min)'
          key: mailcow.mail[rejects_reputation,10]
          delay: 10m
          history: 31d
          value_type: FLOAT
          units: msg
          description: Odrzucenia przez serwery docelowe z powodow reputacji/list blokujacych (Microsoft S3140/S3150, Gmail 5.7.26/4.7.0, Spamhaus, blocklist...).
          tags:
            - tag: component
              value: reputation
          triggers:
            - uuid: c601be8dd2f34195b7fcbe3fbdfee3a2
              expression: last(/Mailcow by Zabbix agent/mailcow.mail[rejects_reputation,10])>0
              name: 'Mailcow: remote servers reject mail for reputation reasons'
              priority: AVERAGE
              description: 'Serwery docelowe odrzucaja poczte powolujac sie na reputacje/listy blokujace. Sprawdz log: docker compose logs --since 1h postfix-mailcow | grep -iE ''block|reputation|S3150|5.7.26'''
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: reputation
        - uuid: efe639f247d5437d8b80d425f876d19c
          name: 'Mailcow: containers running'
          key: mailcow.mail[containers_running]
          delay: 2m
          history: 31d
          value_type: FLOAT
          description: Liczba dzialajacych kontenerow mailcow (*-mailcow-*).
          tags:
            - tag: component
              value: containers
        - uuid: d4f8aa3c1bbb4260917bfc8d47612f15
          name: 'Mailcow: containers down/unhealthy'
          key: mailcow.mail[containers_down]
          delay: 2m
          history: 31d
          value_type: FLOAT
          description: Kontenery mailcow zatrzymane, restartujace sie lub w stanie unhealthy.
          tags:
            - tag: component
              value: containers
          triggers:
            - uuid: c4175d013634457d93f7b99b6cc0b26e
              expression: min(/Mailcow by Zabbix agent/mailcow.mail[containers_down],5m)>0
              name: 'Mailcow: {ITEM.LASTVALUE1} container(s) down or unhealthy'
              priority: HIGH
              description: 'Sprawdz: cd /opt/mailcow-dockerized && docker compose ps'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 80e6097dc4ea409aa27c58ef96ded808
          name: 'Mailcow: last backup age'
          key: mailcow.mail[backup_age,{$MAILCOW.BACKUP.DIR}]
          delay: 30m
          history: 31d
          value_type: FLOAT
          units: h
          description: Wiek najnowszego katalogu mailcow-* w {$MAILCOW.BACKUP.DIR} (h). -1 = brak backupu/katalogu.
          tags:
            - tag: component
              value: backup
          triggers:
            - uuid: 0d4bd1f6dcd14826aacf1d5c603880d7
              expression: last(/Mailcow by Zabbix agent/mailcow.mail[backup_age,{$MAILCOW.BACKUP.DIR}])>{$MAILCOW.BACKUP.MAXAGE} or last(/Mailcow by Zabbix agent/mailcow.mail[backup_age,{$MAILCOW.BACKUP.DIR}])<0
              name: 'Mailcow: no backup newer than {$MAILCOW.BACKUP.MAXAGE}h in {$MAILCOW.BACKUP.DIR}'
              priority: HIGH
              description: Ostatni backup jest za stary albo go nie ma. Sprawdz cron/timer backupu (helper-scripts/backup_and_restore.sh) i miejsce na dysku.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: backup
        - uuid: 961086e3b22b435fa8f895b5becac1f5
          name: 'DNS: PTR of {$MAIL.IP}'
          key: mailrep.ptr[{$MAIL.IP},{$DNS.RESOLVER}]
          delay: 1h
          history: 90d
          value_type: CHAR
          description: Rekord PTR (rDNS) adresu IP serwera. Musi wskazywac {$MAIL.HOSTNAME}.
          tags:
            - tag: component
              value: dns
          triggers:
            - uuid: 69ea7c6f2cc54cf2b60e5f54999c5f0a
              expression: find(/Mailcow by Zabbix agent/mailrep.ptr[{$MAIL.IP},{$DNS.RESOLVER}],,"regexp","^{$MAIL.HOSTNAME}$")=0 and find(/Mailcow by Zabbix agent/mailrep.ptr[{$MAIL.IP},{$DNS.RESOLVER}],,"like","DNS_ERROR")=0
              name: 'Mailcow: PTR of {$MAIL.IP} is not {$MAIL.HOSTNAME}'
              priority: AVERAGE
              description: Brak zgodnego rDNS powoduje odrzucanie lub spam-folder u wielu odbiorcow. PTR ustawia sie u dostawcy serwera (Infomaniak/Hetzner).
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: reputation
        - uuid: 3299a82515054cc597f7e83598265181
          name: 'DNS: {$MAIL.HOSTNAME} resolves to {$MAIL.IP}'
          key: mailrep.fcrdns[{$MAIL.HOSTNAME},{$MAIL.IP},{$DNS.RESOLVER}]
          delay: 1h
          history: 31d
          description: 'Forward-confirmed rDNS: rekord A nazwy hosta zawiera IP serwera.'
          valuemap:
            name: Mailcow yes/no
          tags:
            - tag: component
              value: dns
          triggers:
            - uuid: 4cce3ca9f08b412e8f9176f08abacbd5
              expression: max(/Mailcow by Zabbix agent/mailrep.fcrdns[{$MAIL.HOSTNAME},{$MAIL.IP},{$DNS.RESOLVER}],#2)=0
              name: 'Mailcow: {$MAIL.HOSTNAME} does not resolve to {$MAIL.IP}'
              priority: AVERAGE
              description: Rekord A hosta pocztowego nie wskazuje na IP serwera (FCrDNS nie przejdzie).
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: reputation
        - uuid: ec408131b5e64b62b1844019aa504997
          name: 'TLS: HTTPS certificate days left'
          key: mailrep.certdays[{$MAIL.HOSTNAME},443]
          delay: 6h
          history: 31d
          value_type: FLOAT
          units: d
          description: Dni do wygasniecia certyfikatu HTTPS na {$MAIL.HOSTNAME}:443. -1 = brak polaczenia.
          tags:
            - tag: component
              value: tls
          triggers:
            - uuid: 327b700b94244af4ac4a99bbc6264455
              expression: last(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},443])>=0 and last(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},443])<{$CERT.EXPIRY.WARN}
              name: 'Mailcow: HTTPS certificate expires in {ITEM.LASTVALUE1} days'
              priority: AVERAGE
              description: Certyfikat mailcow (ACME) powinien odnawiac sie automatycznie - sprawdz kontener acme-mailcow.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
            - uuid: 02d611b491154d3d8597c0226eaaf6dd
              expression: max(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},443],#3)<0
              name: 'Mailcow: cannot check HTTPS certificate on port 443'
              priority: WARNING
              description: Brak polaczenia TLS z serwera monitorowanego do samego siebie (port zamkniety, hairpin NAT, timeout).
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: bf56e1d182434ace803b674b4492b758
          name: 'TLS: SMTP STARTTLS certificate days left'
          key: mailrep.certdays[{$MAIL.HOSTNAME},25,smtp]
          delay: 6h
          history: 31d
          value_type: FLOAT
          units: d
          description: Dni do wygasniecia certyfikatu SMTP STARTTLS na {$MAIL.HOSTNAME}:25. -1 = brak polaczenia.
          tags:
            - tag: component
              value: tls
          triggers:
            - uuid: b837c596c8834f98ac24ed7c081e6813
              expression: last(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},25,smtp])>=0 and last(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},25,smtp])<{$CERT.EXPIRY.WARN}
              name: 'Mailcow: SMTP STARTTLS certificate expires in {ITEM.LASTVALUE1} days'
              priority: AVERAGE
              description: Certyfikat mailcow (ACME) powinien odnawiac sie automatycznie - sprawdz kontener acme-mailcow.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
            - uuid: 28ff78c45bac4638afc2793a4044d475
              expression: max(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},25,smtp],#3)<0
              name: 'Mailcow: cannot check SMTP STARTTLS certificate on port 25'
              priority: WARNING
              description: Brak polaczenia TLS z serwera monitorowanego do samego siebie (port zamkniety, hairpin NAT, timeout).
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 11ca8fe689094b51993f1c1d68c1e393
          name: 'TLS: Submission STARTTLS certificate days left'
          key: mailrep.certdays[{$MAIL.HOSTNAME},587,smtp]
          delay: 6h
          history: 31d
          value_type: FLOAT
          units: d
          description: Dni do wygasniecia certyfikatu Submission STARTTLS na {$MAIL.HOSTNAME}:587. -1 = brak polaczenia.
          tags:
            - tag: component
              value: tls
          triggers:
            - uuid: 80a85ab4a4854662a600b30cf7e0b5f6
              expression: last(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},587,smtp])>=0 and last(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},587,smtp])<{$CERT.EXPIRY.WARN}
              name: 'Mailcow: Submission STARTTLS certificate expires in {ITEM.LASTVALUE1} days'
              priority: AVERAGE
              description: Certyfikat mailcow (ACME) powinien odnawiac sie automatycznie - sprawdz kontener acme-mailcow.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
            - uuid: 4035548d967044458539f56c3a0ee1f6
              expression: max(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},587,smtp],#3)<0
              name: 'Mailcow: cannot check Submission STARTTLS certificate on port 587'
              priority: WARNING
              description: Brak polaczenia TLS z serwera monitorowanego do samego siebie (port zamkniety, hairpin NAT, timeout).
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 9705397fe561499f9267b5b63daaa2e5
          name: 'TLS: IMAPS certificate days left'
          key: mailrep.certdays[{$MAIL.HOSTNAME},993]
          delay: 6h
          history: 31d
          value_type: FLOAT
          units: d
          description: Dni do wygasniecia certyfikatu IMAPS na {$MAIL.HOSTNAME}:993. -1 = brak polaczenia.
          tags:
            - tag: component
              value: tls
          triggers:
            - uuid: 40e4feb078514bb9a4439e7200ad32b5
              expression: last(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},993])>=0 and last(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},993])<{$CERT.EXPIRY.WARN}
              name: 'Mailcow: IMAPS certificate expires in {ITEM.LASTVALUE1} days'
              priority: AVERAGE
              description: Certyfikat mailcow (ACME) powinien odnawiac sie automatycznie - sprawdz kontener acme-mailcow.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
            - uuid: edf89b6c041e4c1c968ef97b2173216c
              expression: max(/Mailcow by Zabbix agent/mailrep.certdays[{$MAIL.HOSTNAME},993],#3)<0
              name: 'Mailcow: cannot check IMAPS certificate on port 993'
              priority: WARNING
              description: Brak polaczenia TLS z serwera monitorowanego do samego siebie (port zamkniety, hairpin NAT, timeout).
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: e1d561cc0c6b43c5a2af6a79e99940ca
          name: 'Service: SMTP port 25'
          type: SIMPLE
          key: net.tcp.service[smtp,{$MAIL.HOSTNAME},25]
          delay: 1m
          history: 31d
          description: Dostepnosc SMTP z serwera/proxy Zabbix (simple check).
          valuemap:
            name: Mailcow yes/no
          tags:
            - tag: component
              value: services
          triggers:
            - uuid: 7e07922841864de19a3166a126abfeff
              expression: max(/Mailcow by Zabbix agent/net.tcp.service[smtp,{$MAIL.HOSTNAME},25],#3)=0
              name: 'Mailcow: SMTP (port 25) is not reachable'
              priority: HIGH
              description: Usluga nie odpowiada 3 razy z rzedu. Sprawdz kontenery, firewall i blokady portow u dostawcy.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: a628a9b657104b059c621b6b77562d24
          name: 'Service: SMTPS port 465'
          type: SIMPLE
          key: net.tcp.service[tcp,{$MAIL.HOSTNAME},465]
          delay: 1m
          history: 31d
          description: Dostepnosc SMTPS z serwera/proxy Zabbix (simple check).
          valuemap:
            name: Mailcow yes/no
          tags:
            - tag: component
              value: services
          triggers:
            - uuid: b432d212693f4253a8721dc508f8c9c5
              expression: max(/Mailcow by Zabbix agent/net.tcp.service[tcp,{$MAIL.HOSTNAME},465],#3)=0
              name: 'Mailcow: SMTPS (port 465) is not reachable'
              priority: AVERAGE
              description: Usluga nie odpowiada 3 razy z rzedu. Sprawdz kontenery, firewall i blokady portow u dostawcy.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
